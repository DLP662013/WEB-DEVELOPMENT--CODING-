<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snow-Leopard Fact Card</title>

    <style>
    /* Page Background - sets the color and font for the whole page */
    body {
        background-color: darkgreen;
        font-family: Arial, sans-serif;
    }

    /* Box Model - width sets the content area */
    .fact-file {
        background-color:lightyellow ;
        color: darkslategray;
        padding: 25px;
        width: 260px;
        border: 4px solid forestgreen;
        margin: 30px;
    }

    /* Animal Name - forestgreen so it stands out */
    .animal-name {
        color: forestgreen;
        font-size: 22px;
    }

    /* Detail Row - dark text on the light background */
    .detail {
        color: darkslategrey;
    }

    /* Cool Fact - to make it speacial */
    .cool-fact {
        color: darkorange;
        font-style: italic;
    }
    </style>

</head>
<body>
    
<div class="fact-file">
<h2 class="animal-name">Snow Leopard</h2>
<p class="detial">Type : Big Cat</p>
<p class="detail">Lives-in : Moutain ranges of Central Asia</p>
<p class="detail">Diet : Deers, Goats, and Wild-Sheeps</p>
<p class="cool-fact">Cool Fact : Can leap upto 15 meters in one jump.</p>
</div>

</body>
</html>
