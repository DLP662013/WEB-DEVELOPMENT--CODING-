<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Super-Hero Card</title>

    <style>

        /*Typography - font, size, weight, colour for the whole page*/
        body {
             background-color : blue;
             color : white;
             font-family : Arial, sans-serif;
        }
        /*Typography + Text Shadow - big bold title with an orange shadow*/
        .heroname{
            font-size : 60px;
            font-weight : bold;
            color : yellow;
            text-shadow : 3px 3px orange;
        }
        .label {
            text-transform : uppercase;
            text-decoration : underline;
            color : coral
        }
        /*Typography + Text Transform - tagline becomes Title Case*/
        .tagline {
            font-size : italic;
            color: lightblue;
            text-transform: capitalize;
        }
        /* Typography - powers stand out in bold green */
        .powers{
            font-weight : bold;
            color : lightgreen;
        }
        /* Text Decoration - weakness are croosed out */
        .weakness {
            text-decoration : line-through;
            color : gray;
        }
        /* Transform - the badges is tilted to the side */
        .badge{
            font-size : 28px;
            font-weight : bold;
            color : gold;
            transform: rotate(15deg);
        }
        /* Typography - footer text */
        .made by {
            color: coral;
            font-style : italic;
        }

    </style>

</head>
<body>
    
    <h1 class="hero-name"> Thunder-Kid</h1>
    <p class="tagline">the most powerful kid in the school</p>

    <h2 class="label">Super Powers</h2>
    <p class="power">Can run faster then a cheetah</p>
    <p class="power">can lift a School bus</p>

    <h2 class="label">Weakness</h2>
    <p class="weakness">Maths Homework</p>
    <p class="weakness">Broccoli</p>

    <p class="badge">Top Hero</p>

    <p class="made-by">Created By DLP</p>
</body>
</html>
