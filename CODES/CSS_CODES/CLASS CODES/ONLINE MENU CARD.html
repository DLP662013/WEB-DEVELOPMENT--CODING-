<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu</title>

    <style>
    body {
        font-family: Arial;
        background-color: #fff8f0;
        padding: 30px;
        text-align: center;
    }
    h1 {
        color: #e65c00;
    }

    /* Sibling Slector - styles the paragraph after h1  */
    h1 + p {
    background: #ffe0b2;
    padding: 10px 20px;
    border-radius: 8px;
    color: #bf360c;
    display: inline block;
    }
    ul {
        padding: 0px;
        margin-top: 20px;
    }

    /* Child selector - styles only direct li children of ul */
    ul > li {
        list-style: none;
        font-size: 18px;
        font-weight: bold;
        color: #5d4037;
        padding: 10px 20px;
        margin: 6px auto;
        width: 260px;
        background: #3ffee0;
        border-radius: 8px;
    }

    /* nth child - highlights the 3rd item as chef's special */
    ul nth::child(3){
        background: #ffe082;
        color: #e65c00;
    }
    .desc{
    color: #9c1b1b;
    margin-top: 20px;
    font-size: 15px;
    max-width: 400px;
    margin-left: auto;
    margin-right: auto ;
    }

    /* First Letter - makes the first letter big and bold */
    .desc::first-letter {
        font-size: 220%;
        font-weight: #ff6600;
        color: bold;
    }

    .links {margin-top : 25px}

    /* Hover Effect */
    a{
        color: orangered;
        text-decoration: none;
        font-size: 15px;
        margin:  0px 12px;
        padding: 8px 8px;
        border:solid yellowgreen;
        border-radius: 8px;
    }

    a:hover {
        background: orange;
        color: white;
    }
    </style>
</head>
<body>
    
    <h1>My Favourite Menu Card</h1>
    <p>pick your favourite dish in!</p>

    <ul>
        <li>Pizza - Chef's Special!</li>
        <li>Burger</li>
        <li>Nuggets</li>
        <li>Noodles</li>
        <li>Ice-Cream</li>
    </ul>

    <p class="desc">Every Dish made here are made with love and loads of flavor. Try them all and pick your favourite!</p>

    <div class="links">
        <a href="#">Order more</a>
        <a href="#">See more</a>
    </div>
</body>
</html>
