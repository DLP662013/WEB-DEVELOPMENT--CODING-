<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cartoon Charecter Card</title>

    <style>


        /*Universal Selecter - applies to every thing on the page*/
        {
            font-size:"20px"
    }

        /*Element Selecter*/
        body {
            background-color : yellow; 
        }
        h1 {
            color : black;
        }
        h2 {
            color: red;
        }
        p {
            color: green;
        }

        /*Class Selecter*/
        cartoon-detail {
            color : blue;
        }

        /*ID-Selecter*/
        cartoon-card {
        color : cyan
        }


    </style>
</head>
<body>
    
    <h1>My Favourite Cartoon Charecters :-</h1>

    <!--Inline CSS-->

    <div id="cartoon-card">
   <h2>
        <h2 class="cartoon-detail">1.) Shinchan</h2><br>
        <h2 class="cartoon-detail">2.) Doraemon</h2><br>
    </h2>
    </div>
</body>
</html>
