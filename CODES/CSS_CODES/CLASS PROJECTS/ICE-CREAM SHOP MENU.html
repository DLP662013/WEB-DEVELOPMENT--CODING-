<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tummy's-Cravings Ice-Cream Shop Menu</title>

    <style>
    body {
      font-family: Arial, sans-serif;
      background-image:url("https://static.vecteezy.com/system/resources/previews/004/552/634/non_2x/seamless-pattern-ice-cream-cone-cute-cartoon-style-background-with-cherry-and-heart-icon-design-used-for-fabric-textile-publication-illustration-free-vector.jpg") ;
      text-align: center;
      color: #4a2c2a;
    }
    h1 {
      color: #291d18;
      font-size: 36px;
    }
    h1 + p {
      color: #e22b2b;
      font-weight: bold;
      background-color: #ffe3f1;
      border-radius: 10px;
    }
    .shop-description::first-letter {
      font-size: 36px;
      color: #ff1493;
      font-weight: bold;
    }
    .menu-box {
      width: 420px;
      background-color: white;
      border: 3px solid #ff69b4;
      border-radius: 15px;
      margin: 20px auto;
      padding: 20px;
    }
    ul {
      padding: 0;
    }
    ul > li {
      list-style: none;
      background-color: #fff0f5;
      color: #5c2a4a;
      font-size: 18px;
      font-weight: bold;
      margin: 10px;
      padding: 12px;
      border-radius: 10px;
      border: 2px solid #ffb6c1;
    }
    ul > li:nth-child(3) {
      background-color: #fff3cd;
      color: #b85c00;
      border: 3px solid #ffa500;
    }
    ul > li:hover {
      background-color: #1fb1c1;
      color: white;
      cursor: pointer;
      transform: scale(1.05);
    }
    button {
      background-color: #dad013;
      color: white;
      border: none;
      border-radius: 20px;
      padding: 12px 24px;
      font-size: 16px;
      font-weight: bold;
    }
    button:hover {
      background-color: #1cf504;
    }
  </style>
</head>
<body>
  <h1>Tummy's Cravings Ice Cream Shop Menu</h1>
  <p><marquee behavior="auto" direction="left">Welcome to Tummy's Cravings Ice-Cream Shop!</marquee></p>
  <p class="shop-description">
    We serve colourful, creamy, and flavour-full of  ice creams.
  </p>
  <div class="menu-box">
    <h2>TC's Flagship Ice Cream Flavours</h2>
    <ul>
      <li>Chocolate Delight</li>
      <li>Strawberry Swirl</li>
      <li>Lotus Biscoff - Shop's Special</li>
      <li>Vanilla Dream</li>
      <li>Mango Magic</li>
    </ul>
    <button>Order Now</button>
  </div>
</body>
</html>
