<!--Starting the Project-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Timer</title>
    <!--Style of the Timer App-->
    <style>
      * {
        margin: 0;

        padding: 0;

        box-sizing: border-box;

        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        height: 100vh;

        display: flex;

        justify-content: center;

        align-items: center;

        background: linear-gradient(135deg, #0f172a, #1e293b);
      }

      .wrapper {
        text-align: center;

        background: white;

        padding: 40px;

        border-radius: 20px;

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);

        min-width: 350px;

        align-items: center;
      }

      h1 {
        color: #1e293b;

        margin-bottom: 20px;

        font-size: 2.5rem;
      }

      p {
        font-size: 4rem;

        font-weight: bold;

        color: #2563eb;

        margin-bottom: 25px;
      }

      button {
        border: none;

        padding: 12px 24px;

        margin: 5px;

        font-size: 1rem;

        font-weight: bold;

        border-radius: 10px;

        cursor: pointer;

        transition: all 0.3s ease;
      }

      #button-start {
        background: #22c55e;

        color: white;
      }

      #button-stop {
        background: #ef4444;

        color: white;
      }

      #button-reset {
        background: #f59e0b;

        color: white;
      }

      #button-set {
        background: olive;
      }

      button:hover {
        transform: translateY(-3px);

        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      button:active {
        transform: scale(0.95);
      }
    </style>
  </head>
  <body>
    <!--Setting the Needed Items-->
    <div class="wrapper">
      <h1>Timer</h1>
      <button onclick="setTimer()" id="button-set">Set Timer</button>
      <p>
        <span id="minutes">00</span>
        :
        <span id="seconds">00</span>
      </p>

      <button onclick="startTimer()" id="button-start">Start Timer</button>
      <button onclick="stopTimer()" id="button-stop">Pause Timer</button>
      <button onclick="resetTimer()" id="button-reset">Reset Timer</button>
    </div>

    <!--Giving Functions to the Application-->
    <script>
      //Setting Variables
      var minutes = 0;
      var seconds = 0;
      var appendMinutes = document.getElementById("minutes");
      var appendSeconds = document.getElementById("seconds");
      var buttonStart = document.getElementById("button-start");
      var buttonStop = document.getElementById("button-stop");
      var buttonReset = document.getElementById("button-reset");
      var Interval;

      //----------------------------------------------------------------
      // SETTING THE TIMER -> TIMER SETS ACCORDING TO THE USER'S DESIRE |
      //----------------------------------------------------------------
      function setTimer() {
        var minutes = prompt("Enter the Number of Minutes of your Timer");
        var seconds = prompt("Enter the Number of Seconds of your Timer");

        //Making sure that user typed in the range of numbers
        if (minutes >= 0 && seconds >= 0) {
          // Adding Zero to display timer when they are
          // if minutes is single digit
          if (minutes <= 9) {
            var minutes = "0" + minutes;
          } else {
            var minutes = minutes;
          }

          // if seconds is single digit
          if (seconds <= 9) {
            var seconds = "0" + seconds;
          } else {
            var seconds = seconds;
          }
          appendMinutes.innerHTML = minutes;
          appendSeconds.innerHTML = seconds;
        }
done      }
      //----------------------------------------< Setting Timer Function code Done >-------------------------------------------------------------
    </script>
  </body>
</html>
