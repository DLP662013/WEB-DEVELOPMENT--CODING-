<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Count-Down Timer</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #121212;
      color: #ffffff;
    }

    .wrapper {
      background: #1e1e1e;
      padding: 36px 44px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      width: 360px;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 18px;
      color: #f0f0f0;
    }

    .timer-display {
      font-size: 3.5rem;
      font-weight: bold;
      letter-spacing: 2px;
      background: #141414;
      padding: 18px;
      border-radius: 10px;
      margin-bottom: 14px;
      color: #00e5ff;
    }

    .status {
      min-height: 22px;
      font-size: 0.95rem;
      color: #bbbbbb;
      margin-bottom: 24px;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
    }

    button {
      padding: 10px 16px;
      font-size: 0.95rem;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.1s ease, opacity 0.2s ease;
    }

    button:hover {
      opacity: 0.9;
    }

    button:active {
      transform: scale(0.97);
    }

    #button-set {
      background: #ffab00;
      color: #121212;
    }

    #button-start {
      background: #00e676;
      color: #121212;
    }

    #button-stop {
      background: #ff5252;
      color: #ffffff;
    }

    #button-reset {
      background: #448aff;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>Count-Down Timer</h1>

    <div class="timer-display">
      <span id="minutes">00</span>:<span id="seconds">00</span>
    </div>

    <p id="status-text" class="status">Click "Set Timer" to begin.</p>

    <div class="buttons">
      <button id="button-set" onclick="setTimer()">Set Timer</button>
      <button id="button-start" onclick="startTimer()">Start Timer</button>
      <button id="button-stop" onclick="stopTimer()">Pause Timer</button>
      <button id="button-reset" onclick="resetTimer()">Reset Timer</button>
    </div>
  </div>

  <script>
    var totalSeconds = 0;
    var savedTotalSeconds = 0;
    var UsercanStart = false;
    var isSettingTimer = false;
    var interval = null;

    var appendMinutes = document.getElementById("minutes");
    var appendSeconds = document.getElementById("seconds");
    var statusText = document.getElementById("status-text");

    function formatTwoDigits(num) {
      return num <= 9 ? "0" + num : String(num);
    }

    function updateDisplay(secs) {
      var mins = Math.floor(secs / 60);
      var remSecs = secs % 60;
      appendMinutes.innerHTML = formatTwoDigits(mins);
      appendSeconds.innerHTML = formatTwoDigits(remSecs);
    }

    function setTimer() {
      if (isSettingTimer) {
        alert("Timer is already being set. Please wait a moment.");
        return;
      }

      stopTimer();

      var minutesInput = prompt("Enter the Number of Minutes of your Timer");
      if (minutesInput === null) return;

      var secondsInput = prompt("Enter the Number of Seconds of your Timer");
      if (secondsInput === null) return;

      var minNum = Number(minutesInput);
      var secNum = Number(secondsInput);

      var validMinutes =
        minutesInput.trim() !== "" &&
        !Number.isNaN(minNum) &&
        Number.isInteger(minNum) &&
        minNum >= 0;

      var validSeconds =
        secondsInput.trim() !== "" &&
        !Number.isNaN(secNum) &&
        Number.isInteger(secNum) &&
        secNum >= 0;

      if (!validMinutes || !validSeconds) {
        alert("Please enter valid whole numbers (0 or greater) for minutes and seconds.");
        setTimer();
        return;
      }

      if (minNum === 0 && secNum === 0) {
        alert("Your timer has no time (both minutes and seconds are 0). Please enter a positive time.");
        setTimer();
        return;
      }

      // Short break/loading state before locking in the timer
      isSettingTimer = true;
      UsercanStart = false;
      statusText.innerHTML = "Setting your Timer...";
      appendMinutes.innerHTML = "--";
      appendSeconds.innerHTML = "--";

      var combinedSeconds = minNum * 60 + secNum;

      setTimeout(function () {
        totalSeconds = combinedSeconds;
        savedTotalSeconds = combinedSeconds;
        updateDisplay(totalSeconds);
        UsercanStart = true;
        isSettingTimer = false;
        statusText.innerHTML = "Timer is set! Click Start Timer.";
        alert("Your timer has been set. You can now start your timer!");
      }, 1500);
    }

    function startTimer() {
      if (isSettingTimer) {
        alert("Please wait until the timer finishes setting.");
        return;
      }

      if (UsercanStart !== true || totalSeconds <= 0) {
        alert("You haven't set your timer yet, so to start the timer first you have to set the timer.");
        return;
      }

      if (interval !== null) {
        return; // already running
      }

      statusText.innerHTML = "Timer running...";

      interval = setInterval(function () {
        totalSeconds--;
        updateDisplay(totalSeconds);

        if (totalSeconds <= 0) {
          stopTimer();
          UsercanStart = false;
          statusText.innerHTML = "Time's up!";
          alert("Time's up!");
        }
      }, 1000);
    }

    function stopTimer() {
      if (interval !== null) {
        clearInterval(interval);
        interval = null;
        if (UsercanStart && totalSeconds > 0) {
          statusText.innerHTML = "Timer paused.";
        }
      }
    }

    function resetTimer() {
      stopTimer();
      totalSeconds = savedTotalSeconds;
      updateDisplay(totalSeconds);
      if (totalSeconds > 0) {
        UsercanStart = true;
        statusText.innerHTML = "Timer reset. Ready to start.";
      } else {
        UsercanStart = false;
        statusText.innerHTML = "Click \"Set Timer\" to begin.";
      }
    }
  </script>
</body>
</html>
