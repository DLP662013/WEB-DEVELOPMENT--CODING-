
<!--Starting the Project-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer</title>

    <style>
      * {
        margin: 0;

        padding: 0;

        box-sizing: border-box;

        font-family: Arial, Helvetica, sans-serif;
      }

      body {
        height: 100vh;

        display: flex;

        justify-content: center;

        align-items: center;

        background: linear-gradient(135deg, #0f172a, #1e293b);
      }

      .wrapper {
        text-align: center;

        background: white;

        padding: 40px;

        border-radius: 20px;

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);

        min-width: 350px;
      }

      h1 {
        color: #1e293b;

        margin-bottom: 20px;

        font-size: 2.5rem;
      }

      p {
        font-size: 4rem;

        font-weight: bold;

        color: #2563eb;

        margin-bottom: 25px;
      }

      button {
        border: none;

        padding: 12px 24px;

        margin: 5px;

        font-size: 1rem;

        font-weight: bold;

        border-radius: 10px;

        cursor: pointer;

        transition: all 0.3s ease;
      }

      #button-start {
        background: #22c55e;

        color: white;
      }
      
      button:hover {
        transform: translateY(-3px);

        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      button:active {
        transform: scale(0.95);
      }
    </style>

</head>
<body>
    
    <div class="wrapper">
        <h1>Timer</h1>
    </div>

</body>
</html>
