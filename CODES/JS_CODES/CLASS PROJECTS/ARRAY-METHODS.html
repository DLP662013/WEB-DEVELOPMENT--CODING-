<!doctype html>
<title>Array-Methods</title>
<html>
  <body>
    <h2>JavaScript Objects Data Structure and Array</h2>
    <p id="join"></p>
    <p id="demo-1"></p>
    <p id="demo-2"></p>
    <p id="demo-3"></p>
    <p id="demo-4"></p>
    <script>
      var student = ["name = DLP", "age = 13", "school = Bhashyam Blooms"];

      var color = ["white", "black", "red", "green", "blue"];

      document.getElementById("join").innerHTML = student.join(" ; ");

      document.getElementById("demo-1").innerHTML = color.join(" , ");
      document.getElementById("demo-2").innerHTML = color;
      color.pop();
      document.getElementById("demo-3").innerHTML = color;
      color.pop();
      document.getElementById("demo-4").innerHTML = color;
    </script>
  </body>
</html>
