<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Today-is...</title>


    <style>
      * {
        margin: 0;

        padding: 0;

        box-sizing: border-box;

        font-family: "Segoe UI", sans-serif;
      }

      body {
        height: 100vh;

        display: flex;

        justify-content: center;

        align-items: center;

        background: linear-gradient(135deg, #141e30, #243b55);
      }

      #MyDisplay {
        padding: 30px 60px;

        font-size: 4rem;

        font-weight: bold;

        color: #fff;

        letter-spacing: 5px;

        background: rgba(255, 255, 255, 0.1);

        border-radius: 20px;

        backdrop-filter: blur(10px);

        -webkit-backdrop-filter: blur(10px);

        border: 1px solid rgba(255, 255, 255, 0.2);

        box-shadow:
          0 8px 32px rgba(0, 0, 0, 0.3),
          0 0 20px rgba(0, 255, 255, 0.3);

        text-shadow: 0 0 10px rgba(0, 255, 255, 0.8);
      }

      @media (max-width: 768px) {
        #MyDisplay {
          font-size: 2rem;

          padding: 20px 30px;
        }
      }
    </style>

</head>
<body>
    
    <div onload="today()" id="MyDisplay"></div>
    <div id="demo"></div>
    
    <script>
        function today() {
            var target =  new Date();
            var day = target.getDay();
            var month = target.getMonth();
            var date = target.getDate();
            var year = target.getFullYear();
            
            //Changing Day Numbers into Words
            if (day == 0) {
              var day = "Sunday";
            }
            if (day == 1) {
              var day = "Monday";
            }
            if (day == 2) {
              var day = "Tuesday";
            }
            if (day == 3) {
              var day = "Wednesday";
            }
            if (day == 4) {
              var day = "Thusday";
            }
            if (day == 5) {
              var day = "Friday";
            }
            if (day == 6) {
              var day = "Saturday";
            }
     
            //Changing Month Numbers into Name of Month
            if (month == 0) {
              var month = "January";
            }
            if (month == 1) {
              var month = "February";
            }
            if (month == 2) {
              var month = "March";
            }
            if (month == 3) {
              var month = "April";
            }
            if (month == 4) {
              var month = "May";
            }
            if (month == 5) {
              var month = "June";
            }
            if (month == 6) {
              var month = "July";
            }
            if (month == 7) {
              var month = "August";
            }
            if (month == 8) {
              var month = "September";
            }
            if (month == 9) {
              var month = "October";
            }
            if (month == 10) {
              var month = "November";
            }
            if(month == 11) {
              var month = "December";
            }

            //Displaying The current day, month, date, year; in order
            var answer = day + "," + " " + month + " " + date + " " + year;
            document.getElementById("MyDisplay").innerText = answer;
          }
        today()
        
    </script>
          

                    <!--Successfully-Completed-->

                       
</body>
</html>
