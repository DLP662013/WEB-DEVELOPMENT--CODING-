<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider</title>
</head>
<body>
    <section>
  <img class="mySlides" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQZ50k29z9wb-Uee4qhuREGQyDYrK-_duLZgLHICNTJFawxWvt9OnedPJwt&s=10" style="height:650px; width:1240px;">
  <img class="mySlides" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTLJRgODMd5yC5-23yG4siuPXMytZT4XhUlcaZKTrUOjg&s" style="height:650px; width:1240px;">
  <img class="mySlides" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS5aE62d-C8-ptUI7EeGEHfjV3OczE8qIb0JlFIijX-8CH1oCu5AXiYpRE&s" style="height:650px; width:1240px;">
</section>

<script>
// Automatic Slideshow - change image every 3 seconds
var myIndex = 0;
carousel();

function carousel() {
  var i;
  var x = document.getElementsByClassName("mySlides");
  for (i = 0; i < x.length; i++) {
    x[i].style.display = "none";
  }
  myIndex++;
  if (myIndex > x.length) {myIndex = 1}
  x[myIndex-1].style.display = "block";
  setTimeout(carousel, 3000);
}
</script>



</body>
</html>
