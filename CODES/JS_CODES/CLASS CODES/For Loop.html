<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Java-Scipts_For Loop</title>
</head>
<body>
    <p id="demo"></p>
    <script>
        var friuts = ["apple","banana","mango","watermelon","grapes","jackfruit"];
        var text = "";
        var i;

        for (i=0; i<friuts.length;i++){
            text+=friuts[i] + "<br>";
        }
        document.getElementById("demo").innerHTML=text;

    </script>
</body>
</html>
