<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array - Methods</title>
</head>
<body>
    <h2>JS Array Methods</h2>
    <h2>Join() and Pop()</h2>

    <p>The join() method joins the array elements into one srting, and the pop() method removes the last element from an array.</p>
    <p id="my-join"></p>
    <p id="my-first-pop"></p>
    <p id="my-second-pop"></p>

    <script>
        var friuts = ["banana","orange","apple","mango"];
        document.getElementById("my-join").innerHTML = friuts.join(" * ");
        document.getElementById("my-first-pop").innerHTML = friuts;
        friuts.pop();
        document.getElementById("my-second-pop").innerHTML = friuts;
        
    </script>
</body>
</html>
