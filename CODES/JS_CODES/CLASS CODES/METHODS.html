<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Methods</title>
</head>
<body>
    

<h2>Java-Script String Methods</h2>
<p>Basic Methods</p>

<script>
    var string = "AmIaZinG";
    document.write(string.toUpperCase());
    document.write("<br>");
    document.write(string.toLowerCase());
    document.write("<br>");
    document.write(string.startsWith("i"));
    document.write("<br>");

     var str = "I learnt about Methods";
     var patt = new RegExp("about");
     var res = patt.test(str);
     document.write(res);
</script>

</body>
</html>
