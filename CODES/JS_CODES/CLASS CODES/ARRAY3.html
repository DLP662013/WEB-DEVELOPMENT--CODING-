<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Array</title>
  </head>
  <body>
    <p>Click the button to evaluate</p>
    <p id="result"></p>

    <button onclick="myFunction()">TRY IT!</button>

    <script>
      function myFunction() {
        var x = 10;
        var y = 20;

        var a = eval("x+y") + "<br>";
        var b = eval("y-x") + "<br>";
        var c = eval("2*2") + "<br>";

var res = a+b+c;

document.getElementById("result").innerHTML=res

      }
    </script>
  </body>
</html>
