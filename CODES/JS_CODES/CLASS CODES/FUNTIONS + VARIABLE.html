<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Funtions + Variable</title>
</head>
<body>
    
<p>A funtion can access variables defined inside a funtion :</p>
<button type="button" onclick = "my()">Click Me!</button>
<p id="demo0"></p>
<p id="demo1"></p>
<p id="demo2"></p>


<script>
    var b = 5;
    function my() {
    var a = 5;
    document.getElementById("demo0").innerHTML=b*a;
    }
    document.getElementById("demo1").innerHTML=a;
    document.getElementById("demo2").innerHTML=b;


</script>


</body>
</html>
