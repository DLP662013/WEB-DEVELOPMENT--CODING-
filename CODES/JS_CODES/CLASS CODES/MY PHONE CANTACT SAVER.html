<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact-Saver</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <style>
      body {
          background-color: #f0f0f2;
      }
      h1 {
          color: #ff5a43;
      }
      .card-label {
          font-size: 11px;
          color: #999;
          text-transform: uppercase;
      }
      pre {
          font-size: 13px;
          color: #333;
      }
    </style>
  </head>
  <body class="py-4">
    <div class="container">
      <h1 class="mb-1">My Phone Contact-Saver</h1>
      <p class="text-muted mb-4">Introduction to Objects in Java-Script</p>

      <div class="card-shadow-sm mb-3" style="max-width: 400px">
        <div class="card-body">
          <h5 class="card-title" style="color: #ff5a43">Contact-Details</h5>
          <ul class="list-group list-group-flush">
            <li class="list-group-item">
              <span class="card-label d-block">Name</span>
              <strong id="name">-</strong>
            </li>
            <li class="list-group-item">
              <span class="card-label d-block">Contact</span>
              <strong id="phone">-</strong>
            </li>
            <li class="list-group-item">
              <span class="card-label d-block">School</span>
              <strong id="school">-</strong>
            </li>
            <li class="list-group-item">
              <span class="card-label d-block">City</span>
              <strong id="city">-</strong>
            </li>
          </ul>
        </div>
      </div>
      <div class="card-shadow-sm" style="max-width: 400px">
        <div class="card-body">
          <h6 style="color: #ff5a43">Java-Script Objects used</h6>
          <pre id="code-Display" class="bg-light p-3 rounded border mb-0"></pre>
        </div>
      </div>
    </div>

    <script>
      var myContact = {
        name: "D.Lohith Prakul",
        phone: "12345-67890",
        school: "Bhashyam-Blooms",
        city: "Guntur",
      };

      var nameE1 = document.getElementById("name");
      var phoneE1 = document.getElementById("phone");
      nameE1.textContent = myContact.name;
      phoneE1.textContent = myContact.phone;

      var schoolE1 = document.getElementById("school");
      var cityE1 = document.getElementById("city");
      schoolE1.textContent = myContact["school"];
      cityE1.textContent = myContact["city"];

      var codeE1 = document.getElementById("code-Display");
      codeE1.textContent =
        "var myContact = {\n" +
        ' name: "' +
        myContact.name +
        '",\n' +
        ' phone: "' +
        myContact.phone +
        '",\n' +
        ' school: "' +
        myContact["school"] +
        '",\n' +
        ' city: "' +
        myContact["city"] +
        '"\n' +
        "};";
    </script>
  </body>
</html>
