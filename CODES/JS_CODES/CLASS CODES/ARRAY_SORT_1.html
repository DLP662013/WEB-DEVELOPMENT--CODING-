<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array Sort 1</title>
</head>
<body>
    <h2>JavaScript Array Sort</h2>
    <p>Click the button the sort the numbers in the ascending order.</p>

    <button onclick="ascending()">Ascending Order</button>
    <button onclick="descending()">Descending Order</button>

<p id="result"></p>

<script>
    var points = [6,3,5,8,1,0];

    document.getElementById("result").innerHTML=points;

    function ascending() {
        points.sort(function (a,b) {
            return a-b;
        });
        document.getElementById("result").innerHTML=points;
    }

    function descending() {
        points.sort(function (a,b) {
            return b-a;
        });
        document.getElementById("result").innerHTML=points;
    }




</script>

</body>
</html>
