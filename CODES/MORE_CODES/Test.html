<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Global Reset */
*, *::before, *::after {
  box-sizing: border-box;
}
body {
  margin: 0;
  font-family: sans-serif;
  background-color: #111827; /* Dark background */
  color: #FFFFFF;
}

/* Black Navigation Bar */
.navbar {
  display: flex;
  background-color: #000000; /* Pure black background */
  padding: 15px 30px;
  border-bottom: 1px solid #1F2937;
}

.nav-link {
  color: #9CA3AF; /* Muted grey for unclicked links */
  text-decoration: none;
  margin-right: 20px;
  font-size: 16px;
  transition: all 0.2s ease-in-out;
}

/* Hover State: Sleek White Glow-Up */
.nav-link:hover {
  color: #FFFFFF;
}

/* Clicked / Active Link State: Electric Blue Glow */
.nav-link.active {
  color: #3B82F6;
  font-weight: bold;
}

/* PAGE DISPLAY LOGIC */
.page-section {
  display: none; /* Hides all pages by default */
  padding: 40px;
}

.page-section.active {
  display: block; /* Shows only the active page */
}
    </style>
</head>
<body>
    <nav class="navbar">
  <a href="#" class="nav-link active" data-target="home">Home</a>
  <a href="#" class="nav-link" data-target="dresses">Dresses</a>
  <a href="#" class="nav-link" data-target="search-page">Search</a>
</nav>

<!-- The Page Content Sections -->
<div class="page-container">
  <!-- Home Section (Visible by default) -->
  <section id="home" class="page-section">
    <h1>Welcome to the Store</h1>
    <p>Explore our trending collections.</p>
  </section>

  <!-- Dresses Section (Hidden by default) -->
  <section id="dresses" class="page-section">
    <h1>Trending Dresses</h1>
    <p>Flat-lay and product-only listings display.</p>
  </section>

  <!-- Search Section (Hidden by default) -->
  <section id="search-page" class="page-section">
    <h1>Search Results</h1>
    <p>Find your items here.</p>
  </section>
</div>

<script>
    // Select all navigation links and page sections
const navLinks = document.querySelectorAll('.nav-link');
const pageSections = document.querySelectorAll('.page-section');

navLinks.forEach(link => {
  link.addEventListener('click', function(event) {
    // 1. Prevent the page from jumping or reloading
    event.preventDefault();

    // 2. Remove the active class from all links
    navLinks.forEach(nav => nav.classList.remove('active'));

    // 3. Add the active class to the link that was just clicked
    this.classList.add('active');

    // 4. Remove the active class from all page content sections
    pageSections.forEach(section => section.classList.remove('active'));

    // 5. Get the id of the target page from the data attribute
    const targetId = this.getAttribute('data-target');

    // 6. Display the target section by adding the active class
    document.getElementById(targetId).classList.add('active');
  });
});
</script>
</body>
</html>
